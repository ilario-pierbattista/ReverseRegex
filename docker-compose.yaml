services:
  php74: &common
    build: &build
      dockerfile: php.Dockerfile
      context: .docker
      args:
        - BASE=php:7.4-cli-alpine
    tty: true
    volumes:
      - .:/usr/app
    user: "1000:1000"
    working_dir: /usr/app
  php80:
    <<: *common
    build:
      <<: *build
      args:
        - BASE=php:8.0-cli-alpine
  php81:
    <<: *common
    build:
      <<: *build
      args:
        - BASE=php:8.1-cli-alpine
  php82:
    <<: *common
    build:
      <<: *build
      args:
        - BASE=php:8.2-cli-alpine
  php83:
    <<: *common
    build:
      <<: *build
      args:
        - BASE=php:8.3-cli-alpine
  php84:
    <<: *common
    build:
      <<: *build
      args:
        - BASE=php:8.4-cli-alpine
